name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: expense_tracker
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_tracker -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expense_tracker:ci_test_password@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://expense_tracker:ci_test_password@localhost:5432/expense_tracker_test
      JWT_SECRET_KEY: ci_only_jwt_secret_not_for_production_123456789
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Alembic migrations
        run: |
          alembic upgrade head
          alembic current --check-heads
          alembic check

      - name: Build Docker image
        run: docker build -t expense-tracker-api:ci .
